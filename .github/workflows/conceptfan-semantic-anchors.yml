name: ConceptFAN semantic anchor validation pilot

on:
  push:
    branches:
      - experiment/conceptfan-semantic-anchors-v1-20261102
    paths:
      - 'src/conceptfan_realdata/semantic_anchors.py'
      - 'scripts/medical/run_semantic_anchor_validation.py'
      - 'configs/medical/semantic_anchor_validation_v1.yaml'
      - 'tests/physionet2012/test_semantic_anchors.py'
      - '.github/workflows/conceptfan-semantic-anchors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-only-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU-only experimental dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Validate new concept math and existing model contracts
        run: |
          set -euo pipefail
          python -m compileall -q src/conceptfan_realdata/semantic_anchors.py scripts/medical/run_semantic_anchor_validation.py tests/physionet2012/test_semantic_anchors.py
          python -m pytest tests/physionet2012/test_semantic_anchors.py tests/physionet2012/test_model_contract.py -q
      - name: Run frozen-design synthetic TRAIN/VALIDATION comparison
        run: |
          set -euo pipefail
          python scripts/medical/run_semantic_anchor_validation.py \
            --config configs/medical/semantic_anchor_validation_v1.yaml \
            --out-dir "$RUNNER_TEMP/semantic_anchor_pilot"
          mkdir -p results_semantic_anchor
          cp "$RUNNER_TEMP/semantic_anchor_pilot/"* results_semantic_anchor/
      - name: Publish aggregate validation-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-anchor-validation-${{ github.run_number }}
          path: results_semantic_anchor/
          retention-days: 21
          if-no-files-found: warn
