name: ConceptFAN V40 matched difference raw baselines and nonlinear source falsification
on:
  push:
    branches:
      - experiment/conceptfan-v40-difference-baselines-nonlinear-20261106
    paths:
      - '.github/workflows/ioi-v40-matched-difference.yml'
      - 'src/conceptfan_discovery/difference_bench_world_v40.py'
      - 'src/conceptfan_discovery/matched_raw_baselines_v40.py'
      - 'tests/discovery/test_difference_baselines_v40.py'
      - 'scripts/experiment_matched_difference_v40.py'
      - 'scripts/audit_matched_difference_v40.py'
      - 'docs/medical/CONCEPTFAN_V40_FROZEN_MATCHED_DIFFERENCE_BASELINES_PROTOCOL_20261106.md'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  four-independent-devices:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install actual CPU PyTorch ConceptFAN and supervised comparators
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify registered new-world algebra, raw mask firewall and V39 regression
        run: |
          python -m compileall -q \
            src/conceptfan_discovery/difference_bench_world_v40.py \
            src/conceptfan_discovery/matched_raw_baselines_v40.py \
            scripts/experiment_matched_difference_v40.py
          python -m pytest -q \
            tests/discovery/test_difference_baselines_v40.py \
            tests/discovery/test_paired_isolation_v39.py \
            tests/discovery/test_inference_v38.py \
            tests/discovery/test_native_adaptive_type3_transformer_v34.py
      - name: Smoke one real native K2 vs 6 raw measured reference baselines
        run: |
          python scripts/experiment_matched_difference_v40.py \
            --smoke --out-dir V40_SMOKE | tee V40_SMOKE_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V40_SMOKE/STATUS.json').read_text())
          assert d['status']=='V40_SMOKE_ONLY'
          assert d['devices']==[20261407]
          assert d['n_train']==360
          assert d['n_real_native_K2_fits']==1
          assert d['n_TEST_metric_rows']==9*5*(4+6)
          assert d['n_summary']==9*5*10
          assert d['n_dual_VALID_receipts']==9*3
          assert d['n_PRE_REGISTERED_AP_CIs']==8
          assert d['same_TEST_patient_K2_sensor_mask_across_every_method']
          assert d['raw_diff_baselines_see_true_measured_pair_ON_OFF_no_H_or_S']
          assert len(d['native_concept_explanation_examples'])==1
          assert Path('V40_SMOKE/FROZEN_TEST_PREDICTIONS.npz').is_file()
          PY
      - name: Full 4 NEW devices and two data families, 12 real Temporal ConceptFAN fits
        run: |
          python scripts/experiment_matched_difference_v40.py \
            --out-dir V40_EVIDENCE | tee V40_FULL_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V40_EVIDENCE/STATUS.json').read_text())
          assert d['status']=='V40_MATCHED_RAW_DIFFERENCE_NONLINEAR_EXECUTED'
          assert d['devices']==[20261407,20261409,20261421,20261423]
          assert len(d['device_families'])==4
          assert list(d['device_families'].values()).count('linear_AR')==2
          assert list(d['device_families'].values()).count('nonlinear_switching')==2
          assert (d['n_train'],d['n_valid1'],d['n_valid2'],d['n_test'])==(1000,400,400,600)
          assert d['n_real_native_K2_fits']==12
          assert d['n_TEST_metric_rows']==4*9*5*(4*3+6)
          assert d['n_summary']==4*9*5*10
          assert d['n_dual_VALID_receipts']==4*9*3*3
          assert d['n_PRE_REGISTERED_AP_CIs']==4*8
          assert len(d['native_concept_explanation_examples'])==12
          assert d['same_TEST_patient_K2_sensor_mask_across_every_method']
          assert d['no_TEST_y_used_in_feature_fit_or_gate']
          assert d['source_definition_frozen_before_TEST']
          assert d['physical_switch_is_external_supervision']
          assert all(x['n_outcome_training_labels'] in (1000,1800)
                     for x in d['test_metric_rows'])
          assert all(x['source_use']==0
                     for x in d['summary']
                     if x['method'] in ('DIFF_AB','DIFF_ABC')
                     and (x['case']=='OFF_reference_unavailable'
                          or x['stress']=='missing_reference'))
          assert Path('V40_EVIDENCE/FROZEN_TEST_PREDICTIONS.npz').is_file()
          assert len(list(Path('V40_EVIDENCE/CHECKPOINTS').glob('native_K2_*.pt')))==12
          PY
          git rev-parse HEAD > V40_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Archive actual evidence, positive results and prespecified negative worlds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v40-matched-difference-${{ github.run_number }}
          path: |
            V40_SMOKE/
            V40_EVIDENCE/
            V40_SMOKE_LOG.jsonl
            V40_FULL_LOG.jsonl
          if-no-files-found: ignore
