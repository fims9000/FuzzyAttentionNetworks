name: ConceptFAN V22e workflow evidence status inspection
on:
  push:
    branches: [experiment/conceptfan-v22-mixed-source-identifiability-20261104]
    paths:
      - '.github/workflows/conceptfan-v22e-inspect-status.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get authoritative V22e external comparator CI status via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/medical/evidence_v22
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f branch="experiment/conceptfan-v22-mixed-source-identifiability-20261104" \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(.name | contains("V22e real logistic and HGB external predictive baselines")) | {id, name, event, head_sha, status, conclusion, html_url, run_number}]' \
            > docs/medical/evidence_v22/V22E_LATEST_WORKFLOW_STATUS.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/medical/evidence_v22/V22E_LATEST_WORKFLOW_STATUS.json')
          rows=json.loads(p.read_text())
          print('V22e workflow runs:',rows)
          PY
      - name: Persist diagnostic status without changing experimental results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/medical/evidence_v22/V22E_LATEST_WORKFLOW_STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V22e: record authoritative external-model workflow execution state"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/experiment/conceptfan-v22-mixed-source-identifiability-20261104; then exit 0; fi
            git fetch origin experiment/conceptfan-v22-mixed-source-identifiability-20261104
            git rebase origin/experiment/conceptfan-v22-mixed-source-identifiability-20261104
          done
          exit 1
