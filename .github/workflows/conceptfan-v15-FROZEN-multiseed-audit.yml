name: V15 frozen two-seed multi-environment falsification
on:
  push:
    branches: [experiment/conceptfan-v15-temporal-noise-controls-20261104]
    paths: ['.github/workflows/conceptfan-v15-FROZEN-multiseed-audit.yml']
permissions:
  contents: read
jobs:
  full-denominator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src:.
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Negative controls
        run: |
          python -m pytest tests/discovery/test_noise_separation_v15.py -q
      - name: Frozen all-conditions experiment
        run: |
          python -m conceptfan_discovery.experiment_v15 --out-dir V15_FROZEN > v15_run.log 2>&1 || { tail -n 90 v15_run.log; exit 1; }
          tail -n 20 v15_run.log
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('V15_FROZEN/STATUS.json').read_text())
          assert d['n_trials']==72 and d['denominator_includes_all_rejections']
          PY
          git rev-parse HEAD > V15_FROZEN/COMMIT_SHA.txt
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V15-frozen-twoseed-full-denominator-${{ github.run_number }}
          path: |
            V15_FROZEN/
            v15_run.log
          if-no-files-found: warn
