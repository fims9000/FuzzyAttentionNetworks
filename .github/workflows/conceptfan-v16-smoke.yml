name: ConceptFAN V16 native feedback smoke
on:
  push:
    branches: [experiment/conceptfan-v16-expert-feedback-native-20261104]
    paths: ['.github/workflows/conceptfan-v16-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify new feedback and existing V10 contracts
        run: |
          python -m pytest tests/discovery/test_expert_feedback_v16.py tests/discovery/test_multiscale_physiology_v10.py -q
