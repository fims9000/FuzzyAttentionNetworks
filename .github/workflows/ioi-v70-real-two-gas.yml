name: V70 truly new independent acetone/ethanol mixture whole-trial study

on:
  push:
    branches:
      - research/conceptfan-v70-unseen-two-gas-mixture-20261113
    paths:
      - 'src/conceptfan_discovery/trialwise_dualstream_fuzzy_v70.py'
      - 'scripts/experiment_real_uci308_two_gas_v70.py'
      - 'tests/discovery/test_trialwise_dualstream_mixture_v70.py'
      - 'docs/medical/CONCEPTFAN_V70_FROZEN_UNSEEN_TWO_GAS_MIXTURE_PROTOCOL_20261113.md'
      - '.github/workflows/ioi-v70-real-two-gas.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  physical-two-analyte-unseen-family:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific environment and source package
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify independent trial unit, causal source and original untouched suite
        run: |
          python -m compileall -q src/conceptfan_discovery/trialwise_dualstream_fuzzy_v70.py scripts/experiment_real_uci308_two_gas_v70.py
          python -m pytest -q tests/discovery/test_trialwise_dualstream_mixture_v70.py tests/discovery/test_dualstream_multifuzzy_v65.py
      - name: Restore pinned official original UCI308 source (different data family)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/conceptfan_v70/uci308.zip
          key: uci308-exact-original-public-20261113
      - name: Download official UCI308 on branch-cache miss and enforce original SHA
        run: |
          mkdir -p /tmp/conceptfan_v70
          if [ ! -s /tmp/conceptfan_v70/uci308.zip ]; then
            curl -fSL --retry 2 --connect-timeout 20 --max-time 180 \
              'https://archive.ics.uci.edu/static/public/308/gas%2Bsensor%2Barray%2Bunder%2Bflow%2Bmodulation.zip' \
              -o /tmp/conceptfan_v70/uci308.zip || \
            curl -fSL --retry 2 --connect-timeout 20 --max-time 180 \
              'https://archive.ics.uci.edu/static/public/308/gas+sensor+array+under+flow+modulation.zip' \
              -o /tmp/conceptfan_v70/uci308.zip
          fi
          unzip -tq /tmp/conceptfan_v70/uci308.zip
          echo '7b062960dbef1a9e8aefc62bc7dbac09bdadb8cbb40793cf2b8e122da1862f90  /tmp/conceptfan_v70/uci308.zip' | sha256sum -c -
      - name: Execute first UCI308 full official two-gas mixture holdout
        run: |
          set -o pipefail
          python scripts/experiment_real_uci308_two_gas_v70.py \
            --uci-zip /tmp/conceptfan_v70/uci308.zip \
            --out-dir V70_INDEPENDENT_REAL_TWO_GAS_EVIDENCE | tee v70_trial_log.jsonl
          python - <<'PY'
          import json
          s=json.load(open('V70_INDEPENDENT_REAL_TWO_GAS_EVIDENCE/STATUS.json'))
          assert s['status']=='V70_NEW_REAL_ACETONE_ETHANOL_TWO_ANALYTE_MIXTURE_TRIALS_EXECUTED'
          assert s['original_official_zip_sha256']=='7b062960dbef1a9e8aefc62bc7dbac09bdadb8cbb40793cf2b8e122da1862f90'
          assert s['real_original_independent_trial_split']=={'TRAIN':39,'VALID':11,'TEST':8}
          assert s['dataset_physical_trial_structure']['raw_data_sensor_row_count']==928
          assert s['source_fit_used_NO_preparation_doses_or_gas_labels']
          assert s['n_independent_real_physical_TEST_trials']==8
          assert len(s['all_predeclared_regression_metrics'])==20
          assert not s['real_physical_source_identity_proven']
          assert s['water_dilution_percent_is_not_airborne_gas_concentration']
          for h in s['exact_additive_signed_concept_head_receipts']:
            assert h['head']['max_source_only_signed_additive_prediction_error']<1e-9
          PY
          git rev-parse HEAD > V70_INDEPENDENT_REAL_TWO_GAS_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Retain full aggregate experiment, never raw proprietary sensor rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v70-unseen-real-two-analyte-mixed-trial-evidence
          path: |
            V70_INDEPENDENT_REAL_TWO_GAS_EVIDENCE/
            v70_trial_log.jsonl
          if-no-files-found: warn
          retention-days: 90
