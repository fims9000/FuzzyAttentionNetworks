name: ConceptFAN V10 matched V7 multiscale PhysioNet study

on:
  push:
    branches:
      - experiment/conceptfan-v10-multiscale-20261103
    paths:
      - 'src/conceptfan_discovery/multiscale_physiology_v10.py'
      - 'src/conceptfan_discovery/clinical_multiscale_v10.py'
      - 'tests/discovery/test_multiscale_physiology_v10.py'
      - 'configs/medical/pd_clinical_v10_multiscale.yaml'
      - '.github/workflows/conceptfan-v10-matched.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refit-v7-and-multiscale:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Validate exact transparent concept and temporal support contracts
        run: |
          set -euo pipefail
          python -m compileall -q src/conceptfan_discovery/multiscale_physiology_v10.py src/conceptfan_discovery/clinical_multiscale_v10.py tests/discovery/test_multiscale_physiology_v10.py
          python -m pytest tests/discovery/test_multiscale_physiology_v10.py \
            tests/discovery/test_observation_process_concepts_v7.py -q
      - name: Download official public PhysioNet Set A and label file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source_physionet"
          curl -fsSL --retry 3 --max-time 180 \
            https://physionet.org/files/challenge-2012/1.0.0/set-a.zip \
            -o "$RUNNER_TEMP/source_physionet/set-a.zip"
          curl -fsSL --retry 3 --max-time 60 \
            https://physionet.org/files/challenge-2012/1.0.0/Outcomes-a.txt \
            -o "$RUNNER_TEMP/source_physionet/Outcomes-a.txt"
          unzip -tq "$RUNNER_TEMP/source_physionet/set-a.zip" | tail -n 2
          sha256sum "$RUNNER_TEMP/source_physionet/"* > v10_original_public_data_hashes.txt
      - name: Train three arms on identically sourced patients, evaluate 3 masks and two concept families
        run: |
          set -euo pipefail
          python -m conceptfan_discovery.clinical_multiscale_v10 \
            --config configs/medical/pd_clinical_v10_multiscale.yaml \
            --reference-v6-config configs/medical/pd_clinical_unknown_neutral_v6.yaml \
            --reference-v7-config configs/medical/pd_clinical_dual_process_v7.yaml \
            --raw-zip "$RUNNER_TEMP/source_physionet/set-a.zip" \
            --outcomes "$RUNNER_TEMP/source_physionet/Outcomes-a.txt" \
            --out-dir "$RUNNER_TEMP/v10_matched" \
            > v10_training.log 2>&1 || { tail -n 180 v10_training.log; exit 1; }
          tail -n 65 v10_training.log
          mkdir -p results_v10
          cp "$RUNNER_TEMP/v10_matched/"* results_v10/
          cp v10_training.log results_v10/
          cp v10_original_public_data_hashes.txt results_v10/
      - name: Upload aggregate validation-only results (never patient-level data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v10-matched-clinical-${{ github.run_number }}
          path: |
            results_v10/
            v10_training.log
            v10_original_public_data_hashes.txt
          retention-days: 21
          if-no-files-found: warn
