name: V70 inspect official unseen two-gas UCI308 schema ONLY

on:
  push:
    branches:
      - research/conceptfan-v70-unseen-two-gas-mixture-20261113
    paths:
      - '.github/workflows/ioi-v70-inspect-two-gas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-schema-before-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download only original licensed UCI308 package
        run: |
          mkdir -p /tmp/conceptfan_v70
          curl -fSL --retry 2 --connect-timeout 20 --max-time 180 \
            'https://archive.ics.uci.edu/static/public/308/gas%2Bsensor%2Barray%2Bunder%2Bflow%2Bmodulation.zip' \
            -o /tmp/conceptfan_v70/uci308.zip || \
          curl -fSL --retry 2 --connect-timeout 20 --max-time 180 \
            'https://archive.ics.uci.edu/static/public/308/gas+sensor+array+under+flow+modulation.zip' \
            -o /tmp/conceptfan_v70/uci308.zip
          unzip -tq /tmp/conceptfan_v70/uci308.zip
          sha256sum /tmp/conceptfan_v70/uci308.zip
      - name: Inspect source schema and header only without opening experiment outcomes
        run: |
          python - <<'PY'
          import zipfile,gzip,csv,io,re
          with zipfile.ZipFile('/tmp/conceptfan_v70/uci308.zip') as z:
            names=[p for p in z.namelist() if not p.endswith('/')]
            print('ARCHIVE_MEMBERS',[(n,z.getinfo(n).file_size) for n in names])
            for name in names:
              if name.endswith('features.csv'):
                with z.open(name) as f:
                  h=f.readline().decode('utf8',errors='replace').strip()
                  print('FEATURE_HEADER_OR_FIRST_RECORD_NUMBER_OF_COLUMNS',len(next(csv.reader([h]))))
                  print('FEATURE_FIELD_NAMES_IF_TEXT',h[:1300] if re.search('[a-zA-Z]{2}',h) else 'NUMERIC_NO_HEADER')
                  first=f.readline().decode('utf8',errors='replace').strip()
                  print('FEATURE_SECOND_ROW_COLUMN_COUNT',len(next(csv.reader([first]))))
              if name.endswith('rawdata.csv.gz'):
                with z.open(name) as stream:
                  with gzip.GzipFile(fileobj=stream) as f:
                    first=f.readline().decode('utf8',errors='replace').strip()
                    second=f.readline().decode('utf8',errors='replace').strip()
                  print('RAW_FIRST_ROW_NUMBER_OF_FIELDS',len(next(csv.reader([first]))))
                  print('RAW_SECOND_ROW_NUMBER_OF_FIELDS',len(next(csv.reader([second]))))
                  print('RAW_FIRST_ROW_ALL_NON_NUMERIC_FIELD_INDICES',
                    [i for i,x in enumerate(next(csv.reader([first])))
                     if x and not re.fullmatch(r'[-+]?\d+(?:\.\d+)?(?:[Ee][-+]?\d+)?',x)][:30])
          PY
      - name: Keep exact official source asset in GitHub workflow cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/conceptfan_v70/uci308.zip
          key: uci308-exact-original-public-20261113
