name: ConceptFAN V19c K3 vs K5 native concept capacity
on:
  push:
    branches: [experiment/conceptfan-v19-temporal-concept-readout-20261104]
    paths:
      - '.github/workflows/conceptfan-v19c-capacity.yml'
      - 'src/conceptfan_discovery/experiment_capacity_v19c.py'
  pull_request:
    branches: [experiment/conceptfan-v18-independent-risk-screen-20261104]
    paths:
      - '.github/workflows/conceptfan-v19c-capacity.yml'
      - 'src/conceptfan_discovery/experiment_capacity_v19c.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src:.
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install exact CPU scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Test V19 shape and old dynamic-admission contracts
        run: |
          python -m pytest tests/discovery/test_temporal_readout_v19.py tests/discovery/test_candidate_admission_v17.py -q
      - name: Run all 36 preregistered K3-vs-K5 ablations
        run: |
          python -m conceptfan_discovery.experiment_capacity_v19c --out-dir V19C_CAPACITY
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('V19C_CAPACITY/STATUS.json').read_text())
          assert x['status']=='V19C_TRAIN_ONLY_FORCED_CONCEPT_CAPACITY_AND_NATIVE_SHAPE'
          assert x['n_fits']==36
          assert len(x['aggregate'])==12
          assert x['all_scenarios_and_seeds_reported']
          assert x['unscreened_k4_k5_are_only_computational_capacity_controls']
          assert x['null_mode_forced_training_is_not_approved_risk_interpretation']
          assert x['no_reuse_of_test_labels']
          assert all(row['max_native_decomposition_error']<2e-5 for row in x['results'])
          PY
          git rev-parse HEAD > V19C_CAPACITY/COMMIT_SHA.txt
      - name: Archive all 36 outcomes and complete denominator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v19c-k3-versus-k5-all-fits-${{ github.run_number }}
          path: V19C_CAPACITY/
          if-no-files-found: warn
      - name: Version synthetic capacity evidence on research branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/experiment/conceptfan-v19-temporal-concept-readout-20261104'
        run: |
          mkdir -p docs/medical/evidence_v19/capacity
          cp V19C_CAPACITY/* docs/medical/evidence_v19/capacity/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/medical/evidence_v19/capacity
          git diff --cached --quiet || git commit -m "V19c: preserve all forced K3/K5 capacity and readout experiment results"
          git push origin HEAD:refs/heads/experiment/conceptfan-v19-temporal-concept-readout-20261104
