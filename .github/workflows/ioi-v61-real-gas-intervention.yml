name: V61 real physical gas intervention and automatic concept identity falsification

on:
  push:
    branches:
      - experiment/conceptfan-v61-real-gas-control-20261113
    paths:
      - 'scripts/experiment_real_gas_interventions_v61.py'
      - 'tests/discovery/test_real_gas_interventions_v61.py'
      - 'docs/medical/CONCEPTFAN_V61_FROZEN_REAL_GAS_INTERVENTION_PROTOCOL_20261113.md'
      - '.github/workflows/ioi-v61-real-gas-intervention.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  controlled-wind-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific environment with CPU-native temporal encoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Compile and test run-split independence, source controls and V56 core
        run: |
          python -m compileall -q scripts/experiment_real_gas_interventions_v61.py
          python -m pytest -q tests/discovery/test_real_gas_interventions_v61.py tests/discovery/test_native_temporal_fuzzy_v56.py
      - name: Download only original UCI 309 archive and validate format
        run: |
          mkdir -p /tmp/conceptfan_v61
          curl -fSL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://archive.ics.uci.edu/static/public/309/gas%2Bsensor%2Barray%2Bexposed%2Bto%2Bturbulent%2Bgas%2Bmixtures.zip' \
            -o /tmp/conceptfan_v61/gas.zip || \
          curl -fSL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://archive.ics.uci.edu/static/public/309/gas+sensor+array+exposed+to+turbulent+gas+mixtures.zip' \
            -o /tmp/conceptfan_v61/gas.zip
          unzip -tq /tmp/conceptfan_v61/gas.zip
          sha256sum /tmp/conceptfan_v61/gas.zip
      - name: New physical source controlled run-level real experiment
        run: |
          set -o pipefail
          python scripts/experiment_real_gas_interventions_v61.py \
            --uci-zip /tmp/conceptfan_v61/gas.zip \
            --out-dir V61_REAL_GAS_EVIDENCE | tee v61_aggregate_log.jsonl
          python - <<'PY'
          import json
          q=json.load(open('V61_REAL_GAS_EVIDENCE/STATUS.json'))
          assert q['status']=='V61_REAL_INDEPENDENT_GAS_PLUMES_EXPLORATORY_COMPLETE'
          assert q['split_whole_recording_counts']=={'TRAIN':120,'VALID':30,'TEST':30}
          assert q['dependent_20step_train_augmentation_count']==360
          assert q['dependent_augmentations_not_claimed_independent']
          assert q['source_fitting_never_receives_gas_names_or_setpoints']
          assert q['input_only_8_physical_gas_sensors']
          assert len(q['whole_run_valid_and_test_metrics'])==36
          assert not q['unique_physical_concept_identification_claimed']
          assert not q['gas_concentration_time_trajectory_labels_available']
          PY
          git rev-parse HEAD > V61_REAL_GAS_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Retain only aggregate physical-source scores and model provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v61-real-gas-controlled-interventions
          path: |
            V61_REAL_GAS_EVIDENCE/
            v61_aggregate_log.jsonl
          if-no-files-found: warn
          retention-days: 90
