name: IOI V28 isolated source admission and unseen device shift
on:
  push:
    branches:
      - experiment/ioi-v28-isolated-candidate-admission-20261106
    paths:
      - '.github/workflows/ioi-v28-isolated-source-admission.yml'
      - 'docs/medical/IOI_V28_FROZEN_ISOLATED_SOURCE_PROTOCOL_20261106.md'
      - 'src/conceptfan_discovery/isolated_source_admission_v28.py'
      - 'scripts/experiment_isolated_source_admission_v28.py'
      - 'tests/discovery/test_isolated_source_admission_v28.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  isolation-and-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU ConceptFAN stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify precommitted source gate, missing-payload and known/unseen shifts
        run: |
          python -m compileall -q \
            src/conceptfan_discovery/isolated_source_admission_v28.py \
            scripts/experiment_isolated_source_admission_v28.py
          python -m pytest -q \
            tests/discovery/test_isolated_source_admission_v28.py \
            tests/fan_attention/test_v27_concept_leakage_guard.py
      - name: Full canonical model training pipeline smoke
        run: |
          python scripts/experiment_isolated_source_admission_v28.py \
            --smoke --out-dir V28_SMOKE | tee V28_SMOKE_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('V28_SMOKE/STATUS.json').read_text())
          assert x['status']=='V28_SMOKE_ONLY'
          assert x['n_unique_k2_native_fit']==1
          assert len(x['rows'])==175
          assert len(x['summary'])==175
          assert len(x['gates'])==5
          assert x['baseline_k2_concept_definitions_frozen']
          assert not x['gate_test_labels_used']
          PY
      - name: Execute fixed V28 3-seed native models and all shift controls
        run: |
          python scripts/experiment_isolated_source_admission_v28.py \
            --out-dir V28_FROZEN_EVIDENCE | tee V28_FULL_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('V28_FROZEN_EVIDENCE/STATUS.json').read_text())
          assert x['status']=='V28_EXECUTED_NATIVE_CONCEPT_ISOLATED_SOURCE_GATE'
          assert x['n_unique_k2_native_fit']==3
          assert x['samples']=={'train':1800,'validation_total':1200,
                                'validation_per_environment':600,'test':900}
          assert len(x['rows'])==375
          assert len(x['summary'])==175
          assert len(x['gates'])==15
          assert x['gate_test_labels_used'] is False
          assert x['artifact_stable_duplicates_existing_data_not_independent']
          assert all(r['native_max_additive_decomposition_error']<2e-5
              for r in x['rows'] if r.get('native_max_additive_decomposition_error') is not None)
          assert all(len(g['environments'])==2 for g in x['gates'])
          # Seen and unseen shift differ ONLY in which validation/source
          # environment has been exposed, not in test labels.
          for seed in (11,23,37):
              by={g['world']:g for g in x['gates'] if g['seed']==seed}
              for k in ('admitted','candidate_coefficient','environments'):
                  assert by['stable_physical'][k]==by['unseen_instrument_break'][k]
                  assert by['stable_physical'][k]==by['stable_instrument_interpretation'][k]
          PY
          git rev-parse HEAD > V28_FROZEN_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Archive all positive, rejected and unexpected predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-ioi-v28-isolated-source-${{ github.run_number }}
          path: |
            V28_SMOKE/
            V28_FROZEN_EVIDENCE/
            V28_SMOKE_LOG.jsonl
            V28_FULL_LOG.jsonl
          if-no-files-found: warn
