name: ConceptFAN V22b disjoint TRAIN source risk and descriptive concepts
on:
  push:
    branches: [experiment/conceptfan-v22-mixed-source-identifiability-20261104]
    paths:
      - '.github/workflows/conceptfan-v22b-source-risk.yml'
      - 'src/conceptfan_discovery/native_source_risk_screen_v22b.py'
      - 'src/conceptfan_discovery/experiment_risk_screened_sources_v22b.py'
      - 'src/conceptfan_discovery/clinical_multiscale_v10.py'
      - 'tests/discovery/test_risk_screened_sources_v22b.py'
  pull_request:
    branches: [experiment/conceptfan-v21-provenance-falsification-20261104]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src:.
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install original CPU research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify disjoint TRAIN labels, native signed starts and no-risk mask contracts
        run: |
          python -m pytest tests/discovery/test_risk_screened_sources_v22b.py tests/discovery/test_mixed_source_v22.py tests/discovery/test_concept_evidence_policy_v21d.py tests/discovery/test_sign_stability_v21b.py -q
      - name: Run all 48 declared source-and-risk optimization opportunities
        run: |
          python -m conceptfan_discovery.experiment_risk_screened_sources_v22b --out-dir V22B_NATIVE_RISK
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('V22B_NATIVE_RISK/STATUS.json').read_text())
          assert x['status']=='V22B_DISJOINT_TRAIN_SCREENED_NATIVE_SOURCE_RISK_ADMISSION'
          assert x['number_registered_opportunities']==48
          assert x['number_fitted_native_models']+x['number_identifiability_abstentions']==48
          assert len(x['summary'])==16
          assert x['source_core_train_n']==600
          assert x['risk_independent_train_n']==200
          assert x['all_source_and_task_risk_labels_disjoint']
          assert x['native_description_risk_veto_persists_across_training']
          assert x['synthetic_test_seed_522203_not_evaluated']
          assert x['all_negative_and_abstained_cases_retained']
          assert all(r['max_native_logit_decomposition_error']<2e-5
                     for r in x['per_fit_or_abstention'] if r['trained'])
          PY
          git rev-parse HEAD > V22B_NATIVE_RISK/COMMIT_SHA.txt
      - name: Archive every model run, screened decision and abstention
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v22b-all-48-source-risk-${{ github.run_number }}
          path: V22B_NATIVE_RISK/
          if-no-files-found: warn
      - name: Version complete screening and native task evidence
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/experiment/conceptfan-v22-mixed-source-identifiability-20261104'
        run: |
          mkdir -p docs/medical/evidence_v22/disjoint_source_risk
          cp V22B_NATIVE_RISK/* docs/medical/evidence_v22/disjoint_source_risk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/medical/evidence_v22/disjoint_source_risk
          git diff --cached --quiet || git commit -m "V22b: retain all 48 independent-label native risk admission opportunities"
          git push origin HEAD:refs/heads/experiment/conceptfan-v22-mixed-source-identifiability-20261104
