name: V53 autonomous temporal ConceptFAN concepts and falsifiers

on:
  push:
    branches:
      - experiment/conceptfan-v53-autonomous-temporal-20261113
    paths:
      - 'src/conceptfan_discovery/autonomous_temporal_bank_v53.py'
      - 'scripts/experiment_autonomous_temporal_v53.py'
      - 'tests/discovery/test_autonomous_temporal_bank_v53.py'
      - 'docs/medical/CONCEPTFAN_V53_FROZEN_AUTONOMOUS_TEMPORAL_PROTOCOL_20261113.md'
      - '.github/workflows/ioi-v53-autonomous-temporal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'

jobs:
  discover-temporal-concepts:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the validated research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Train-only source, masking, causal-prefix, guard and additive regression tests
        run: |
          python -m pytest -q tests/discovery/test_autonomous_temporal_bank_v53.py tests/discovery/test_auto_measured_concept_pipeline.py
      - name: Full architecture smoke with separate output and masks
        run: |
          python scripts/experiment_autonomous_temporal_v53.py --smoke --out-dir V53_SMOKE | tee v53_smoke_log.jsonl
          python - <<'PY'
          import json
          d=json.load(open('V53_SMOKE/STATUS.json'))
          assert d['status']=='SMOKE_ONLY'
          assert d['known_groups_input']==[]
          assert d['true_concept_targets_used']==False
          assert d['outcome_only_enters_post_definition_logistic_fit']
          assert len(d['studies'])==1
          PY
      - name: Two completely new synthetic draws and independent mixed-loading family
        run: |
          python scripts/experiment_autonomous_temporal_v53.py --out-dir V53_EVIDENCE | tee v53_full_log.jsonl
          python - <<'PY'
          import json
          d=json.load(open('V53_EVIDENCE/STATUS.json'))
          assert d['status']=='V53_NEW_SYNTHETIC_EXPLORATORY_COMPLETE'
          assert len(d['studies'])==2
          assert len(d['separate_mixed_loading_generator_family_development'])==3
          assert set(x['draw'] for x in d['studies'])=={20261221,20261237}
          assert d['true_concept_targets_used']==False
          assert d['known_groups_input']==[]
          assert d['no_superiority_guarantee']
          for entry in d['studies']:
            assert entry['n_train']==1400 and entry['n_test']==700
          PY
          git rev-parse HEAD > V53_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Preserve numeric and falsification evidence even when a study fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v53-autonomous-temporal
          path: |
            V53_SMOKE/
            V53_EVIDENCE/
            v53_smoke_log.jsonl
            v53_full_log.jsonl
          if-no-files-found: warn
          retention-days: 90
