name: ConceptFAN V60 global ProgramFAN independent hospital stress

on:
  push:
    branches:
      - experiment/conceptfan-v60-program-compiler-20261113
    paths:
      - 'src/conceptfan_discovery/program_compiler_v60.py'
      - 'src/conceptfan_discovery/program_fan_v60.py'
      - 'src/conceptfan_discovery/real_future_tasks_v60.py'
      - 'scripts/experiment_programfan_real_v60.py'
      - 'scripts/verify_programfan_real_v60.py'
      - 'scripts/inspect_programfan_v60_posthoc.py'
      - 'tests/discovery/test_program_compiler_v60.py'
      - 'tests/discovery/test_program_fan_v60.py'
      - '.github/workflows/conceptfan-v60-programs-external.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'

jobs:
  global-programs-fixed-train-cross-site:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native ConceptFAN and official VitalDB real source reader
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check vitaldb
      - name: Check native typed programs and genuine patient-group contracts
        run: |
          python -m pytest -q tests/discovery/test_program_compiler_v60.py tests/discovery/test_program_fan_v60.py tests/discovery/test_vitaldb_external_transfer_v59.py tests/discovery/test_bidmc_realworld_v58.py
      - name: Cache authenticated official BIDMC training numerics only
        uses: actions/cache@v4
        with:
          path: data/bidmc_v58/raw
          key: official-physionet-bidmc-v1-numerics-fix-sha256-53-records-v1
      - name: Authenticate 53 original BIDMC records for TRAIN and VALID
        run: |
          python scripts/download_bidmc_numerics_v58.py --out data/bidmc_v58/raw
      - name: Acquire fixed 80 eligible VitalDB patients based on source availability, NOT outcomes
        run: |
          python scripts/download_vitaldb_external_v59.py \
            --out data/vitaldb_v59/private_source
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/vitaldb_v59/private_source/vitaldb_download_receipt.json').read_text())
          assert r['accepted_external_distinct_patients']==40
          assert r['predeclared_case_candidates']==80
          assert not r['raw_patient_timeseries_uploaded']
          assert not r['raw_subject_ids_exported']
          PY
      - name: Fit ProgramFAN ONLY on BIDMC; evaluate both sites and two registered HR tasks
        run: |
          python scripts/experiment_programfan_real_v60.py \
            --bidmc data/bidmc_v58/raw \
            --vitaldb data/vitaldb_v59/private_source \
            --out results/conceptfan_v60_external \
            --seeds 11 23 --tasks simultaneous future_60s
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/conceptfan_v60_external/report_v60.json').read_text())
          assert r['status']=='EXECUTED_EXPLORATORY_REAL_HOSPITAL_MEASUREMENT'
          assert sorted(r['test_sites'])==['BIDMC','VitalDB']
          assert r['n_native_K2_models']==4
          assert r['n_test_cases']==32
          assert len(r['private_case_sha256'])==32
          assert r['source_predictive_head_TRAIN_Y_only']
          assert r['test_sites_previously_inspected_in_V58_V59']
          assert r['whole_real_patient_VALID_admission']
          assert all(len(m['program_bank']['candidates'])>=1 for m in r['source_manifests'])
          assert all(z['no_patient_group_used_for_TEST_model_selection']
                     for z in r['test_cases'])
          PY
      - name: Independent cross-site case-level source passport and native attribution audit
        run: |
          python scripts/verify_programfan_real_v60.py \
            --dir results/conceptfan_v60_external
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('results/conceptfan_v60_external/verify_v60_audit.json').read_text())
          assert a['status']=='V60_INDEPENDENT_NATIVE_PROGRAM_REAL_CASE_AUDIT_PASS'
          assert a['individual_private_arrays_verified']==32
          assert a['no_source_or_invalid_gate_exact_native_K2_fallback']
          assert a['test_metrics_and_subject_macro_NLL_independently_recomputed']
          PY
      - name: Posthoc whole-patient pulse-only comparator and program-source dependence
        run: |
          python scripts/inspect_programfan_v60_posthoc.py --dir results/conceptfan_v60_external
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/conceptfan_v60_external/posthoc_v60_source_dependence.json').read_text())
          assert r['status']=='V60_POSTHOC_DEPENDENCE_AND_BASELINE_AUDIT_DONE'
          assert r['posthoc_after_primary_TEST_seen']
          assert r['no_model_training_selection_or_admission_change']
          assert len(r['comparison_groups'])==8
          PY
      - name: Preserve source commit hash
        if: always()
        run: |
          mkdir -p results/conceptfan_v60_external
          git rev-parse HEAD > results/conceptfan_v60_external/COMMIT_SHA.txt
      - name: Publish aggregate case/site measurements, no patient values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v60-global-programs-BIDMC-VitalDB-aggregate
          path: |
            results/conceptfan_v60_external/report_v60.json
            results/conceptfan_v60_external/aggregate_cases_v60.csv
            results/conceptfan_v60_external/bidmc_*_split_receipt.json
            results/conceptfan_v60_external/verify_v60_audit.json
            results/conceptfan_v60_external/posthoc_v60_source_dependence.json
            results/conceptfan_v60_external/COMMIT_SHA.txt
            data/vitaldb_v59/private_source/vitaldb_download_receipt.json
            data/vitaldb_v59/private_source/external_cohort_failure_receipt.json
            data/bidmc_v58/raw/download_receipt.json
          if-no-files-found: warn
          retention-days: 90
