name: ConceptFAN V19e native decision head train-only refit
on:
  push:
    branches: [experiment/conceptfan-v19-temporal-concept-readout-20261104]
    paths:
      - '.github/workflows/conceptfan-v19e-native-head-refit.yml'
      - 'src/conceptfan_discovery/native_head_refit_v19e.py'
      - 'src/conceptfan_discovery/experiment_native_head_refit_v19e.py'
      - 'tests/discovery/test_native_head_refit_v19e.py'
  pull_request:
    branches: [experiment/conceptfan-v18-independent-risk-screen-20261104]
    paths:
      - '.github/workflows/conceptfan-v19e-native-head-refit.yml'
      - 'src/conceptfan_discovery/native_head_refit_v19e.py'
      - 'src/conceptfan_discovery/experiment_native_head_refit_v19e.py'
      - 'tests/discovery/test_native_head_refit_v19e.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src:.
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install pinned CPU scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Test train-only native risk weight update and previous concept invariants
        run: |
          python -m pytest tests/discovery/test_native_head_refit_v19e.py tests/discovery/test_temporal_readout_v19.py tests/discovery/test_risk_screen_v18.py -q
      - name: Fit 18 native models and refit exactly their existing decision heads
        run: |
          python -m conceptfan_discovery.experiment_native_head_refit_v19e --out-dir V19E_NATIVE_HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('V19E_NATIVE_HEAD/STATUS.json').read_text())
          assert x['status']=='V19E_TRAIN_ONLY_REFIT_EXISTING_NATIVE_RISK_HEAD'
          assert x['n_native_pretrained_models']==18
          assert x['n_direct_native_head_refits']==18
          assert x['no_external_risk_student_head_at_inference']
          assert x['no_raw_input_to_logit_shortcut']
          assert x['physical_concept_parameters_frozen_during_refit']
          assert x['mask_process_head_and_forecast_unchanged']
          assert x['complete_denominator_preserved']
          assert all(r['max_after_additive_error']<2e-5 for r in x['all_fits'])
          PY
          git rev-parse HEAD > V19E_NATIVE_HEAD/COMMIT_SHA.txt
      - name: Archive all successful and unsuccessful native-refit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v19e-18-native-refits-${{ github.run_number }}
          path: V19E_NATIVE_HEAD/
          if-no-files-found: warn
      - name: Version all native refit evidence on trusted research branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/experiment/conceptfan-v19-temporal-concept-readout-20261104'
        run: |
          mkdir -p docs/medical/evidence_v19/native_refit
          cp V19E_NATIVE_HEAD/* docs/medical/evidence_v19/native_refit/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/medical/evidence_v19/native_refit
          git diff --cached --quiet || git commit -m "V19e: save 18 native risk head refit runs and null controls"
          git push origin HEAD:refs/heads/experiment/conceptfan-v19-temporal-concept-readout-20261104
