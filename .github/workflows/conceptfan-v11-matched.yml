name: V11 predictive concepts identifiability on PhysioNet (V10 matched)

on:
  push:
    branches: [experiment/conceptfan-v11-predictive-identifiability-20261103]
    paths:
      - 'src/conceptfan_discovery/identifiability_v11.py'
      - 'src/conceptfan_discovery/rotation_consistency_v11.py'
      - 'src/conceptfan_discovery/train_identifiability_v11.py'
      - 'src/conceptfan_discovery/clinical_identifiability_v11.py'
      - 'tests/discovery/test_identifiability_v11.py'
      - 'tests/discovery/test_group_learning_v11.py'
      - 'configs/medical/pd_clinical_v11_identifiable_groups.yaml'
      - '.github/workflows/conceptfan-v11-matched.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  certified-groups-vs-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native CPU research environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Mathematically falsify V11 axes and train-time group dynamics
        run: |
          set -euo pipefail
          python -m compileall -q src/conceptfan_discovery tests/discovery/test_identifiability_v11.py tests/discovery/test_group_learning_v11.py
          python -m pytest \
            tests/discovery/test_identifiability_v11.py \
            tests/discovery/test_group_learning_v11.py \
            tests/discovery/test_multiscale_physiology_v10.py -q
      - name: Acquire official PhysioNet training data and pinned V10 cohort receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official" "$RUNNER_TEMP/pinned"
          curl -fsSL --retry 3 --max-time 180 \
            https://physionet.org/files/challenge-2012/1.0.0/set-a.zip \
            -o "$RUNNER_TEMP/official/set-a.zip"
          curl -fsSL --retry 3 --max-time 60 \
            https://physionet.org/files/challenge-2012/1.0.0/Outcomes-a.txt \
            -o "$RUNNER_TEMP/official/Outcomes-a.txt"
          gh run download 41623853277 \
            --name conceptfan-v10-matched-clinical-4 \
            --dir "$RUNNER_TEMP/pinned"
          test -s "$RUNNER_TEMP/pinned/results_v10/STATUS.json"
          sha256sum "$RUNNER_TEMP/official/"* > source_sha256.txt
      - name: Train and audit 9 matched V10/V11 models, test sealed
        run: |
          set -euo pipefail
          python -m conceptfan_discovery.clinical_identifiability_v11 \
            --config configs/medical/pd_clinical_v11_identifiable_groups.yaml \
            --reference-v6-config configs/medical/pd_clinical_unknown_neutral_v6.yaml \
            --reference-v7-config configs/medical/pd_clinical_dual_process_v7.yaml \
            --reference-v10-config configs/medical/pd_clinical_v10_multiscale.yaml \
            --frozen-v10-receipt "$RUNNER_TEMP/pinned/results_v10/STATUS.json" \
            --raw-zip "$RUNNER_TEMP/official/set-a.zip" \
            --outcomes "$RUNNER_TEMP/official/Outcomes-a.txt" \
            --out-dir "$RUNNER_TEMP/v11_certified" \
            > v11_execution.log 2>&1 || { tail -n 160 v11_execution.log; exit 1; }
          tail -n 50 v11_execution.log
          mkdir -p v11_evidence
          cp "$RUNNER_TEMP/v11_certified/"*.csv v11_evidence/
          cp "$RUNNER_TEMP/v11_certified/"*.json v11_evidence/
          cp v11_execution.log v11_evidence/
          cp source_sha256.txt v11_evidence/
      - name: Archive only aggregated scientific and training-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v11-predictive-groups-${{ github.run_number }}
          path: |
            v11_evidence/
            v11_execution.log
            source_sha256.txt
          retention-days: 21
          if-no-files-found: warn
