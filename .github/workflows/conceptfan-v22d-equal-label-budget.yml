name: ConceptFAN V22d equal 800-label budget frozen unused TEST
on:
  push:
    branches: [experiment/conceptfan-v22-mixed-source-identifiability-20261104]
    paths:
      - '.github/workflows/conceptfan-v22d-equal-label-budget.yml'
      - 'src/conceptfan_discovery/experiment_equal_label_budget_v22d.py'
      - 'tests/discovery/test_equal_label_budget_v22d.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conceptfan-v22d-equal-budget
  cancel-in-progress: false
jobs:
  equal-train-label-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONPATH: src:.
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install same ConceptFAN CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify that 600+200 and joint 800 share source preparation
        run: |
          python -m pytest tests/discovery/test_equal_label_budget_v22d.py tests/discovery/test_unseen_test_v22c.py tests/discovery/test_risk_screened_sources_v22b.py -q
      - name: Fit all 36 models then score first untouched TEST seed 522313
        run: |
          python -m conceptfan_discovery.experiment_equal_label_budget_v22d --out-dir V22D_EQUAL_BUDGET
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('V22D_EQUAL_BUDGET/STATUS.json').read_text())
          assert x['status']=='V22D_EQUAL_800_LABEL_BUDGET_NATIVE_RISK_SOURCE_COMPARISON'
          assert x['n_registered_native_cases']==48
          assert x['n_trained_native_models']==36
          assert x['n_structural_identifiability_abstentions']==12
          assert x['n_frozen_test_evaluations']==36
          assert x['core_source_proposal_episodes']==600
          assert x['joint_native_fit_episodes']==800
          assert x['screened_native_fit_episodes']==600
          assert x['independent_train_task_risk_screen_episodes']==200
          assert x['fresh_new_test_seed']==522313
          assert x['fresh_test_instantiated_after_every_model_fit']
          assert x['two_arms_consume_same_total_labeled_train_episodes']
          assert x['source_proposal_and_whitener_identical_both_arms']
          assert x['test_scores_never_select_or_update_model']
          assert x['all_model_state_sha256_unchanged_by_test']
          assert x['all_negative_and_abstained_cases_reported']
          assert len(x['summary'])==16
          assert all(r['max_native_logit_decomposition_error']<2e-5
                     for r in x['per_fit'] if r['trained'])
          PY
          git rev-parse HEAD > V22D_EQUAL_BUDGET/COMMIT_SHA.txt
      - name: Archive unchanged new TEST 522313 complete risk/source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v22d-equal-800-labels-new-test-${{ github.run_number }}
          path: V22D_EQUAL_BUDGET/
          if-no-files-found: warn
      - name: Commit all 48 cases to the research branch without force
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p docs/medical/evidence_v22/equal_label_budget
          cp V22D_EQUAL_BUDGET/* docs/medical/evidence_v22/equal_label_budget/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/medical/evidence_v22/equal_label_budget
          git diff --cached --quiet || git commit -m "V22d: archive all 48 equal-label-budget and independent TEST evaluations"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/experiment/conceptfan-v22-mixed-source-identifiability-20261104; then
              exit 0
            fi
            git fetch origin experiment/conceptfan-v22-mixed-source-identifiability-20261104
            git rebase origin/experiment/conceptfan-v22-mixed-source-identifiability-20261104
          done
          echo "Non-fast-forward after three attempts; do not overwrite collaborator commits"
          exit 1
