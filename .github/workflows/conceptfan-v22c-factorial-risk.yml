name: ConceptFAN V22c native source risk sign-mask factorial audit
on:
  push:
    branches: [experiment/conceptfan-v22-mixed-source-identifiability-20261104]
    paths:
      - '.github/workflows/conceptfan-v22c-factorial-risk.yml'
      - 'src/conceptfan_discovery/experiment_factorial_risk_v22c.py'
      - 'tests/discovery/test_factorial_risk_v22c.py'
  pull_request:
    branches: [experiment/conceptfan-v21-provenance-falsification-20261104]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-risk-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src:.
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install original CPU scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify factorial initialization and active-only signed explanation ranking
        run: |
          python -m pytest tests/discovery/test_factorial_risk_v22c.py tests/discovery/test_risk_screened_sources_v22b.py tests/discovery/test_concept_evidence_policy_v21d.py -q
      - name: Execute all 48 factorial risk-training opportunities and abstentions
        run: |
          python -m conceptfan_discovery.experiment_factorial_risk_v22c --out-dir V22C_FACTORIAL_RISK
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('V22C_FACTORIAL_RISK/STATUS.json').read_text())
          assert x['status']=='V22C_NATIVE_RISK_SIGN_VERSUS_DESCRIPTIVE_EXCLUSION_FACTORIAL'
          assert x['n_registered_factorial_opportunities']==48
          assert x['n_native_fits']+x['n_statistical_source_refusals']==48
          assert len(x['aggregate'])==16
          assert x['source_core_train_episode_count']==600
          assert x['risk_screen_train_episode_count']==200
          assert x['no_oracle_used_in_source_or_task_training']
          assert x['true_sources_consulted_only_after_all_family_fits']
          assert x['masked_constant_sources_not_counted_as_zero_stability']
          assert x['test_seed_522203_still_sealed']
          assert x['all_four_factorial_arms_and_negative_cases_reported']
          assert all(r['max_native_logit_decomposition_error']<2e-5
                     for r in x['per_opportunity'] if r['trained'])
          PY
          git rev-parse HEAD > V22C_FACTORIAL_RISK/COMMIT_SHA.txt
      - name: Archive every factorial model and negative condition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v22c-all-48-risk-factorial-${{ github.run_number }}
          path: V22C_FACTORIAL_RISK/
          if-no-files-found: warn
      - name: Persist results only from trusted same-repository Draft PR
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/conceptfan-v22-mixed-source-identifiability-20261104'
        run: |
          mkdir -p docs/medical/evidence_v22/factorial_risk
          cp V22C_FACTORIAL_RISK/* docs/medical/evidence_v22/factorial_risk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/medical/evidence_v22/factorial_risk
          git diff --cached --quiet || git commit -m "V22c: archive all native risk sign/mask factorial fits and active-only attribution metrics"
          git push origin HEAD:refs/heads/experiment/conceptfan-v22-mixed-source-identifiability-20261104
