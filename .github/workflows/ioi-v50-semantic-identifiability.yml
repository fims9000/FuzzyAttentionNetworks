name: ConceptFAN V50 falsifiable identifiability counterexample and external assay calibration
on:
  push:
    branches:
      - experiment/conceptfan-v50-observational-twins-and-anchor-20261106
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  identifiable-under-explicit-assay:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numeric, HGB and existing native ConceptFAN dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Validate proof, independent assay and backward compatible intervention API
        run: |
          python -m compileall -q src/conceptfan_discovery/observational_twins_v50.py src/conceptfan_discovery/independent_anchor_certificate_v50.py scripts/experiment_observational_twins_v50.py scripts/audit_observational_twins_v50.py
          python -m pytest -q tests/discovery/test_observational_twins_anchor_v50.py tests/discovery/test_verified_concept_intervention_v49.py tests/discovery/test_anchored_joint_bottleneck_v47.py
      - name: Completely fresh held-out device smoke including two physical gauges
        run: |
          python scripts/experiment_observational_twins_v50.py --smoke --out-dir V50_SMOKE_EVIDENCE | tee V50_SMOKE_LOG.jsonl
          python scripts/audit_observational_twins_v50.py --evidence-dir V50_SMOKE_EVIDENCE --out-file V50_SMOKE_EVIDENCE/INDEPENDENT_AUDIT.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V50_SMOKE_EVIDENCE/STATUS.json').read_text())
          a=json.loads(Path('V50_SMOKE_EVIDENCE/INDEPENDENT_AUDIT.json').read_text())
          assert d['status']=='V50_SMOKE_OBSERVATIONAL_TWINS'
          assert d['device_seeds']==[20263107]
          assert d['n_external_calibrations']==6
          assert d['n_physical_identification_audit_rows']==18
          assert a['n_independently_refitted_external_source_calibrations']==6
          assert a['maximum_absolute_numerical_error']<1e-10
          assert d['mean_observational_twin_absolute_error_lower_bound']>0
          PY
      - name: Four NEW devices, 8 observational twins, 24 independently assayed calibrations
        run: |
          python scripts/experiment_observational_twins_v50.py --out-dir V50_EVIDENCE | tee V50_FULL_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V50_EVIDENCE/STATUS.json').read_text())
          assert d['status']=='V50_OBSERVATIONAL_TWINS_AND_ANCHOR_EXECUTED'
          assert d['device_seeds']==[20263107,20263109,20263121,20263123]
          assert (d['n_train'],d['n_valid1'],d['n_valid2'],d['n_test'])==(1200,400,400,600)
          assert (d['n_external_calibrations'],d['n_physical_identification_audit_rows'])==(24,72)
          assert (d['n_proof_receipts'],d['n_strong_raw_baseline_rows'])==(4,12)
          assert d['twin_concept_semantics_not_identifiable_without_external_measurement']
          assert d['all_hidden_latent_source_truth_reserved_for_postfit_audit']
          assert Path('V50_EVIDENCE/TEST_OBSERVATIONS_AND_LATENT_AUDIT.npz').is_file()
          PY
          git rev-parse HEAD > V50_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Independent proof, 24 exact Ridge refits, TEST semantic scope and drift audit
        run: |
          python scripts/audit_observational_twins_v50.py --evidence-dir V50_EVIDENCE --out-file V50_EVIDENCE/INDEPENDENT_AUDIT.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('V50_EVIDENCE/INDEPENDENT_AUDIT.json').read_text())
          assert a['status']=='V50_BLIND_NONIDENTIFIABILITY_AND_ASSAY_REFITS_INDEPENDENTLY_VERIFIED'
          assert a['n_exact_observational_twin_pairs']==4
          assert a['n_independently_refitted_external_source_calibrations']==24
          assert a['n_verified_external_TEST_source_rows']==72
          assert a['n_verified_raw_HGB_risk_rows']==12
          assert a['max'+'imum_absolute_numerical_error']<1e-10
          assert a['did_not_import_generator_or_model_or_calibration_module']
          assert a['latent_source_truth_used_for_postfit_metric_audit_only']
          PY
      - name: Preserve all positive and negative devices, including smoke failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v50-observational-identifiability-counterexample
          path: |
            V50_SMOKE_EVIDENCE/
            V50_EVIDENCE/
            V50_SMOKE_LOG.jsonl
            V50_FULL_LOG.jsonl
          if-no-files-found: ignore
