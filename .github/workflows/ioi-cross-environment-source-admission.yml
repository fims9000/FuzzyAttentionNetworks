name: IOI source admission across physically shifted validation environments
on:
  push:
    branches:
      - experiment/ioi-cross-environment-source-admission-20261106
    paths:
      - '.github/workflows/ioi-cross-environment-source-admission.yml'
      - 'docs/medical/IOI_CROSS_ENVIRONMENT_ADMISSION_FROZEN_PROTOCOL_20261106.md'
      - 'src/conceptfan_discovery/cross_environment_transport.py'
      - 'scripts/experiment_cross_environment_source_admission.py'
      - 'tests/discovery/test_cross_environment_source_admission.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  shifted-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixed CPU temporal ConceptFAN dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run falsifiable source shift and paired-bootstrap tests
        run: |
          python -m compileall -q \
            src/conceptfan_discovery/cross_environment_transport.py \
            scripts/experiment_cross_environment_source_admission.py
          python -m pytest -q \
            tests/discovery/test_cross_environment_source_admission.py \
            tests/discovery/test_auto_measured_concept_pipeline.py \
            tests/discovery/test_isolated_source_admission_v28.py
      - name: 'Smoke - actual masked K2 network with train-only measured source groups'
        run: |
          python scripts/experiment_cross_environment_source_admission.py \
            --smoke --out-dir CROSS_ENV_SMOKE | tee CROSS_ENV_SMOKE_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('CROSS_ENV_SMOKE/STATUS.json').read_text())
          assert x['status']=='SMOKE_ONLY'
          assert x['NN_seed_count']==1
          assert x['data_sizes']=={'TRAIN':300,'VALID1':150,'VALID2':150,'TEST':300}
          assert x['actually_shifted_VALID2_values']
          assert x['TEST_outcomes_used_for_training_or_admission'] is False
          assert len(x['summary'])==250
          assert len(x['rows'])==250
          assert len(x['source_selection'])==5
          assert len(x['ci95_paired_TEST_AUPRC'])==10
          PY
      - name: Full new independent episode draw with shifted VALID2 and matched labels
        run: |
          python scripts/experiment_cross_environment_source_admission.py \
            --out-dir CROSS_ENV_EVIDENCE | tee CROSS_ENV_FULL_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('CROSS_ENV_EVIDENCE/STATUS.json').read_text())
          assert d['status']=='SHIFTED_VALID_REAL_ENVIRONMENT_ADMISSION_EVIDENCE'
          assert d['NN_seed_count']==3
          assert d['data_sizes']=={'TRAIN':1700,'VALID1':600,'VALID2':600,'TEST':900}
          assert len(d['summary'])==250
          assert len(d['rows'])==550
          assert len(d['source_selection'])==15
          assert len(d['ci95_paired_TEST_AUPRC'])==10
          assert len(d['gate_differences'])==3*5*(len(d['proposal_manifest']['candidates'])+2)
          assert d['source_proposals_train_only']
          assert d['known_k2_supervised_only_by_masked_measured_proxies']
          assert d['TEST_outcomes_used_for_training_or_admission'] is False
          assert d['same_total_2900_labeled_cases_available_to_all_comparators']
          assert all(r['same_VALID2_patient_labels_both_gates']
                     for r in d['source_selection'])
          assert all(not r['shifted']['semantic_or_physical_identity_confirmed']
                     and not r['iid']['semantic_or_physical_identity_confirmed']
                     for r in d['gate_differences'])
          assert Path('CROSS_ENV_EVIDENCE/FROZEN_TEST_PREDICTIONS.npz').exists()
          PY
          git rev-parse HEAD > CROSS_ENV_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Preserve every acceptance, refusal, gain and out-of-environment failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-ioi-cross-environment-${{ github.run_number }}
          path: |
            CROSS_ENV_SMOKE/
            CROSS_ENV_EVIDENCE/
            CROSS_ENV_SMOKE_LOG.jsonl
            CROSS_ENV_FULL_LOG.jsonl
          if-no-files-found: warn
