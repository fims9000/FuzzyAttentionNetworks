name: ConceptFAN V45 measured OFF condition monitor and matched HGB controls
on:
  push:
    branches:
      - experiment/conceptfan-v45-measured-off-reliability-20261106
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  fresh-synthetic-v45:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU native Temporal ConceptFAN and baselines
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Guard algebra and frozen V44 source regressions
        run: |
          python -m compileall -q src/conceptfan_discovery/off_reference_reliability_v45.py src/conceptfan_discovery/off_reference_world_v45.py scripts/experiment_off_reliability_v45.py
          python -m pytest -q tests/discovery/test_off_reference_reliability_v45.py tests/discovery/test_partial_view_concept_v44.py tests/discovery/test_native_adaptive_type3_transformer_v34.py
      - name: Smoke new device with source OFF guard and matched HGB
        run: |
          python scripts/experiment_off_reliability_v45.py --smoke --out-dir V45_SMOKE | tee V45_SMOKE_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V45_SMOKE/STATUS.json').read_text())
          assert d['status']=='V45_SMOKE'
          assert d['device_seeds']==[20261907]
          assert (d['n_train'],d['n_valid1'],d['n_valid2'],d['n_test'])==(360,150,150,240)
          assert d['n_real_native_fits']==1
          assert len(d['metrics'])==7*5*6
          assert len(d['test_rows'])==7*5*(4*1+2)
          assert len(d['paired_AP_bootstrap'])==6
          assert len(d['gates'])==8
          assert len(d['off_guard_TRAIN_VALID_receipts'])==1
          assert len(list(Path('V45_SMOKE/NATIVE_CHECKPOINTS').glob('*.pt')))==1
          PY
      - name: Full four completely new devices, twelve real native K2 and six methods
        run: |
          python scripts/experiment_off_reliability_v45.py --out-dir V45_EVIDENCE | tee V45_FULL_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V45_EVIDENCE/STATUS.json').read_text())
          assert d['status']=='V45_EXECUTED_NO_POST_TEST_TUNING'
          assert d['device_seeds']==[20261907,20261909,20261921,20261923]
          assert (d['n_train'],d['n_valid1'],d['n_valid2'],d['n_test'])==(1000,400,400,600)
          assert d['n_real_native_fits']==12
          assert len(d['metrics'])==4*7*5*6
          assert len(d['test_rows'])==4*7*5*(4*3+2)
          assert len(d['paired_AP_bootstrap'])==4*6
          assert len(d['gates'])==4*3*2*2*2
          assert len(d['off_guard_TRAIN_VALID_receipts'])==4
          assert len(list(Path('V45_EVIDENCE/NATIVE_CHECKPOINTS').glob('*.pt')))==12
          assert not d['physical_source_identity_certified']
          assert d['measured_OFF_dynamic_energy_gate_is_not_physical_certification']
          assert all(x['source_use']==0 for x in d['metrics']
              if x['method']=='V45_OFF_GUARD' and
                  (x['stress']=='missing_reference' or x['case']=='known_VALID2_OFF_drift'))
          assert Path('V45_EVIDENCE/TEST_PREDICTIONS.npz').is_file()
          PY
          git rev-parse HEAD > V45_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Archive source and negative findings, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v45-measured-off-sentinel
          path: |
            V45_SMOKE/
            V45_EVIDENCE/
            V45_SMOKE_LOG.jsonl
            V45_FULL_LOG.jsonl
          if-no-files-found: ignore
