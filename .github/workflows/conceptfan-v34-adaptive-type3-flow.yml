name: ConceptFAN V34 adaptive IT3 and conditional measured-source flow
on:
  push:
    branches:
      - experiment/conceptfan-v34-adaptive-type3-flow-prototype-20261106
    paths:
      - '.github/workflows/conceptfan-v34-adaptive-type3-flow.yml'
      - 'src/conceptfan_discovery/adaptive_higher_order_concepts_v34.py'
      - 'src/conceptfan_discovery/conditional_source_flow_v34.py'
      - 'tests/discovery/test_adaptive_higher_order_concepts_v34.py'
      - 'tests/discovery/test_conditional_source_flow_v34.py'
      - 'scripts/experiment_adaptive_type3_flow_v34.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  v34-source:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install matched CPU torch and repository scientific requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify fuzzy alpha-plane algebra and conditional-flow provenance
        run: |
          python -m compileall -q src/conceptfan_discovery/adaptive_higher_order_concepts_v34.py src/conceptfan_discovery/conditional_source_flow_v34.py
          python -m pytest -q \
            tests/discovery/test_adaptive_higher_order_concepts_v34.py \
            tests/discovery/test_conditional_source_flow_v34.py \
            tests/discovery/test_masked_temporal_template.py \
            tests/discovery/test_sync_outages_and_interventions_v33.py
      - name: Save available smoke and full study receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v34-type3-flow-${{ github.run_number }}
          path: |
            V34_SMOKE/
            V34_EVIDENCE/
            V34_SMOKE_LOG.jsonl
            V34_FULL_LOG.jsonl
          if-no-files-found: ignore
