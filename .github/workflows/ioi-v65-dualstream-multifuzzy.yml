name: V65 real dynamic gas dual-stream multithreshold fuzzy concept architecture
on:
  push:
    branches:
      - experiment/conceptfan-v65-dualstream-multifuzzy-20261113
    paths:
      - 'src/conceptfan_discovery/dualstream_multifuzzy_bank_v65.py'
      - 'scripts/experiment_dualstream_multifuzzy_v65.py'
      - 'tests/discovery/test_dualstream_multifuzzy_v65.py'
      - 'docs/medical/CONCEPTFAN_V65_FROZEN_DUAL_STREAM_MULTIFUZZY_20261113.md'
      - '.github/workflows/ioi-v65-dualstream-multifuzzy.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  observable-absolute-and-innovation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen scientific and CPU PyTorch dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Compile and verify train-only/masked/causal source and native contracts
        run: |
          python -m compileall -q src/conceptfan_discovery/dualstream_multifuzzy_bank_v65.py scripts/experiment_dualstream_multifuzzy_v65.py
          python -m pytest -q tests/discovery/test_dualstream_multifuzzy_v65.py tests/discovery/test_real_dynamic_gas_ica_v63.py tests/discovery/test_native_temporal_fuzzy_v56.py
      - name: Recover official UCI322 source when a branch-scoped cache is missing
        uses: actions/cache@v4
        with:
          path: /tmp/conceptfan_v63/uci322.zip
          key: original-uci322-archive-20261113
      - name: Pin public original archive SHA and integrity
        run: |
          mkdir -p /tmp/conceptfan_v63
          if [ ! -s /tmp/conceptfan_v63/uci322.zip ]; then
            curl -fSL --retry 3 --connect-timeout 20 --max-time 1200 \
              'https://archive.ics.uci.edu/static/public/322/gas%2Bsensor%2Barray%2Bunder%2Bdynamic%2Bgas%2Bmixtures.zip' \
              -o /tmp/conceptfan_v63/uci322.zip
          fi
          unzip -tq /tmp/conceptfan_v63/uci322.zip
          echo '8b6323b801363e11343ba1a5a7718e76666b715e753b3a40dbdfd1838d953fe7  /tmp/conceptfan_v63/uci322.zip' | sha256sum -c -
      - name: Execute fixed exploratory V65 source-preserving architecture
        run: |
          set -o pipefail
          python scripts/experiment_dualstream_multifuzzy_v65.py \
            --uci-zip /tmp/conceptfan_v63/uci322.zip \
            --out-dir V65_DUALSTREAM_EVIDENCE | tee v65_evidence_log.jsonl
          python - <<'PY'
          import json
          r=json.load(open('V65_DUALSTREAM_EVIDENCE/STATUS.json'))
          assert r['status']=='V65_EXPLORATORY_DUALSTREAM_MULTIFUZZY_EXECUTED'
          assert r['preregistered_after_V63_V64_test_inspection']
          assert not r['new_independent_confirmatory_test']
          assert r['source_and_encoder_never_received_gas_setpoints']
          assert r['n_fuzzy_membership_states']==6*r['original_autonomously_detected_statistical_K']
          assert r['n_visible_concept_only_signed_head_contributions']==2*r['n_fuzzy_membership_states']
          assert len(r['all_original_raw_and_concept_baseline_scores'])==64
          assert len(r['frozen_VALID_incompleteness_flags'])==4
          assert not r['physical_concept_semantics_proven']
          PY
          git rev-parse HEAD > V65_DUALSTREAM_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Preserve full positive and negative aggregate trials, no raw traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v65-real-dualstream-fuzzy-architecture
          path: |
            V65_DUALSTREAM_EVIDENCE/
            v65_evidence_log.jsonl
          if-no-files-found: warn
          retention-days: 90
