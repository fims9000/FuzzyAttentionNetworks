name: ConceptFAN V35 target-specific observability and calibrated source selection
on:
  push:
    branches:
      - experiment/conceptfan-v35-target-observability-20261106
    paths:
      - '.github/workflows/ioi-v35-target-observability.yml'
      - 'src/conceptfan_discovery/target_observability_v35.py'
      - 'src/conceptfan_discovery/mixed_source_benchmark_v35.py'
      - 'tests/discovery/test_target_observability_v35.py'
      - 'scripts/experiment_target_observability_v35.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  v35-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific requirements and real CPU Temporal ConceptFAN
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Test precise nullspace condition and source calibration
        run: |
          python -m compileall -q \
            src/conceptfan_discovery/target_observability_v35.py \
            src/conceptfan_discovery/mixed_source_benchmark_v35.py
          python -m pytest -q \
            tests/discovery/test_target_observability_v35.py \
            tests/discovery/test_native_adaptive_type3_transformer_v34.py \
            tests/discovery/test_conditional_source_flow_v34.py
      - name: 'Smoke - real native K2 on new calibrated mixed-source inverse problem'
        run: |
          python -m compileall -q scripts/experiment_target_observability_v35.py
          python scripts/experiment_target_observability_v35.py \
            --smoke --out-dir V35_SMOKE | tee V35_SMOKE_LOG.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('V35_SMOKE/STATUS.json').read_text())
          assert s['status']=='SMOKE_ONLY'
          assert s['n_train']==300 and s['n_test']==240
          assert s['n_K2_native_transformer_fits']==1
          assert s['n_summary']==5*9*9
          assert s['n_results']==5*9*(7*1+2)
          assert s['n_VALID_candidate_gates']==5*5
          assert s['n_paired_TEST_bootstrap_comparisons']==5
          assert s['new_source_in_real_native_transformer_torch_forward']
          assert s['target_rowspace_weaker_than_full_rank']
          assert s['external_hardware_reference_truth_ASSUMED']
          assert not s['concept_identity_without_calibration_proved']
          assert Path('V35_SMOKE/FROZEN_TEST_PATIENT_PREDICTIONS.npz').exists()
          assert len(list(Path('V35_SMOKE/CHECKPOINTS').glob('native_K2_*.pt')))==1
          PY
      - name: Full 3 actual native Temporal Transformers and 600 fresh TEST subjects
        run: |
          python scripts/experiment_target_observability_v35.py \
            --out-dir V35_EVIDENCE | tee V35_FULL_LOG.jsonl
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          s=json.loads(Path('V35_EVIDENCE/STATUS.json').read_text())
          assert s['status']=='V35_TARGET_SPECIFIC_IDENTIFIABILITY_EXECUTED'
          assert s['n_train']==1200 and s['n_valid1']==400
          assert s['n_valid2']==400 and s['n_test']==600
          assert s['n_K2_native_transformer_fits']==3
          assert s['n_summary']==5*9*9
          assert s['n_results']==5*9*(7*3+2)
          assert s['n_VALID_candidate_gates']==5*3*5
          assert s['n_paired_TEST_bootstrap_comparisons']==5
          assert len(s['human_explanation_passports'])==4
          for passport in s['human_explanation_passports']:
              human=passport['human_facing_explanation']
              assert human['name'].startswith('Калиброванный временной компонент')
              assert human['technical_audit']['source_observed_information_fraction'] is None
              assert human['technical_audit']['independent_device_calibration_available']
              assert human['technical_audit']['type3_boundary_calibration_available'] is False
              assert human['technical_audit']['source_measured_fraction']==passport['observed_measurement_fraction']
              assert 'Наблюдались' in human['measurement_evidence']
              assert human['scientific_limitation'].startswith('Физический смысл')
          assert s['train_valid_test_disjoint'] if 'train_valid_test_disjoint' in s else True
          assert s['TEST_used_to_tune_source_policy'] is False
          assert s['calibrated_true_H_is_not_fed_to_inverse']
          assert s['counterexample']['both_worlds_exactly_observationally_indistinguishable']
          assert len(list(Path('V35_EVIDENCE/CHECKPOINTS').glob('native_K2_*.pt')))==3
          assert Path('V35_EVIDENCE/FROZEN_TEST_PATIENT_PREDICTIONS.npz').exists()
          selected=[r for r in s['summary'] if r['case']=='healthy'
                    and r['method']=='calibrated_target_rowspace']
          assert len(selected)==9
          assert next(x for x in selected if x['stress']=='only_mixture_4')['source_use']==0.
          assert next(x for x in selected if x['stress']=='only_nuisance_5')['source_use']==0.
          assert next(x for x in selected if x['stress']=='no_source_all16')['source_use']==0.
          assert next(x for x in s['summary']
                      if x['case']=='healthy'
                      and x['stress']=='only_target_6'
                      and x['method']=='calibrated_full_rank')['source_use']==0.
          PY
          git rev-parse HEAD > V35_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Upload frozen evidence if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v35-identifiability-${{ github.run_number }}
          path: |
            V35_SMOKE/
            V35_EVIDENCE/
            V35_SMOKE_LOG.jsonl
            V35_FULL_LOG.jsonl
          if-no-files-found: ignore
