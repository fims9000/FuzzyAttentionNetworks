name: ConceptFAN V58 external REAL BIDMC patient-disjoint challenge

on:
  push:
    branches:
      - experiment/conceptfan-v58-real-bidmc-20261113
    paths:
      - 'scripts/download_bidmc_numerics_v58.py'
      - 'src/conceptfan_discovery/bidmc_realworld_v58.py'
      - 'scripts/experiment_conceptfan_bidmc_real_v58.py'
      - 'scripts/verify_conceptfan_bidmc_real_v58.py'
      - 'tests/discovery/test_bidmc_realworld_v58.py'
      - 'docs/medical/CONCEPTFAN_V58_BIDMC_REAL_MEASUREMENTS_FROZEN_PROTOCOL_20261113.md'
      - '.github/workflows/conceptfan-v58-bidmc-real.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'

jobs:
  patient-isolated-real-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU ConceptFAN scientific package
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e .
      - name: Verify real monitoring features and patient leakage invariants on fake fixtures
        run: |
          python -m compileall -q scripts/download_bidmc_numerics_v58.py src/conceptfan_discovery/bidmc_realworld_v58.py scripts/experiment_conceptfan_bidmc_real_v58.py scripts/verify_conceptfan_bidmc_real_v58.py
          python -m pytest -q tests/discovery/test_bidmc_realworld_v58.py tests/discovery/test_operator_library_concepts_v54.py tests/discovery/test_constrained_joint_operator_v55.py
      - name: Cache checksum-verified official BIDMC numerics and patient-group provenance locally
        uses: actions/cache@v4
        with:
          path: data/bidmc_v58/raw
          key: official-physionet-bidmc-v1-numerics-fix-sha256-53-records-v1
      - name: Download authentic PhysioNet files and verify per-file official SHA256
        run: |
          python scripts/download_bidmc_numerics_v58.py --out data/bidmc_v58/raw
      - name: Run native FAN and pretrained-gate-free unsupervised discovery on real patient-disjoint BIDMC
        run: |
          python scripts/experiment_conceptfan_bidmc_real_v58.py \
            --data data/bidmc_v58/raw \
            --out results/conceptfan_v58_bidmc_real \
            --seeds 11 23
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/conceptfan_v58_bidmc_real')
          r=json.loads((p/'report_v58.json').read_text())
          s=json.loads((p/'group_split_manifest.json').read_text())
          assert r['status']=='EXECUTED_REAL_MEASUREMENT_EXPLORATORY'
          assert r['record_count']==53
          assert r['n_models']==2 and r['n_test_conditions']==8
          assert r['no_HR_in_input_features_or_scaler']
          assert r['no_independent_assay_concept_certificate']
          assert s['identified_patient_groups']>=32
          assert not s['identical_patient_in_multiple_splits']
          assert all(x['patient_group_count']>=6 for k,x in s['splits'].items() if k!='train')
          assert all(x['source_status'] for x in r['cases'])
          PY
      - name: Independently audit all real patient-group predictions and exact native fallback
        run: |
          python scripts/verify_conceptfan_bidmc_real_v58.py \
            --dir results/conceptfan_v58_bidmc_real
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/conceptfan_v58_bidmc_real/verify_v58_audit.json')
          x=json.loads(p.read_text())
          assert x['status']=='V58_REAL_BIDMC_INDEPENDENT_CASE_AUDIT_PASS'
          assert x['validated_private_arrays']==8
          assert x['private_arrays_not_uploaded']
          assert x['source_is_not_physically_certified']
          PY
      - name: Preserve exact source revision
        if: always()
        run: |
          mkdir -p results/conceptfan_v58_bidmc_real
          git rev-parse HEAD > results/conceptfan_v58_bidmc_real/COMMIT_SHA.txt
      - name: Upload only pseudonymous aggregate metrics, never individual clinical data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v58-real-bidmc-patient-isolated-metrics
          path: |
            results/conceptfan_v58_bidmc_real/group_split_manifest.json
            results/conceptfan_v58_bidmc_real/report_v58.json
            results/conceptfan_v58_bidmc_real/verify_v58_audit.json
            results/conceptfan_v58_bidmc_real/aggregate_cases_v58.csv
            results/conceptfan_v58_bidmc_real/COMMIT_SHA.txt
            data/bidmc_v58/raw/download_receipt.json
          if-no-files-found: warn
          retention-days: 90
