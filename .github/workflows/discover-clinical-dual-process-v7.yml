name: V7 explicit physiology vs clinical sampling-process concepts

on:
  push:
    branches:
      - experiment/predictive-dynamics-concept-discovery-v1
    paths:
      - 'src/conceptfan_discovery/observation_process_concepts_v7.py'
      - 'src/conceptfan_discovery/clinical_dual_process_experiment_v7.py'
      - 'tests/discovery/test_observation_process_concepts_v7.py'
      - 'tests/discovery/test_dual_process_stability_v7.py'
      - 'src/conceptfan_discovery/dual_process_stability_v7.py'
      - 'configs/medical/pd_clinical_dual_process_v7.yaml'
      - '.github/workflows/discover-clinical-dual-process-v7.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train-separated-clinical-concept-bottleneck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Prove observation-process concept only sees masks and has explicit signed influence
        run: |
          set -euo pipefail
          python -m compileall -q src/conceptfan_discovery
          python -m pytest \
            tests/discovery/test_observation_process_concepts_v7.py \
            tests/discovery/test_dual_process_stability_v7.py \
            tests/discovery/test_unknown_neutral_v6.py \
            tests/discovery/test_pilot_temporal_sensors_v5.py -q
      - name: Download official PhysioNet train/validation source without inspecting test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official"
          curl -fsSL --retry 3 --max-time 180 \
            https://physionet.org/files/challenge-2012/1.0.0/set-a.zip \
            -o "$RUNNER_TEMP/official/set-a.zip"
          curl -fsSL --retry 3 --max-time 60 \
            https://physionet.org/files/challenge-2012/1.0.0/Outcomes-a.txt \
            -o "$RUNNER_TEMP/official/Outcomes-a.txt"
          unzip -tq "$RUNNER_TEMP/official/set-a.zip" | tail -n 2
          sha256sum "$RUNNER_TEMP/official/"* > official_sha256.txt
      - name: Train 3 dual family medical prediction models and audit direct contributions
        run: |
          set -euo pipefail
          python -m conceptfan_discovery.clinical_dual_process_experiment_v7 \
            --config configs/medical/pd_clinical_dual_process_v7.yaml \
            --reference-v6-config configs/medical/pd_clinical_unknown_neutral_v6.yaml \
            --raw-zip "$RUNNER_TEMP/official/set-a.zip" \
            --outcomes "$RUNNER_TEMP/official/Outcomes-a.txt" \
            --out-dir "$RUNNER_TEMP/dual_v7" \
            > dual_process_training.log 2>&1 || { tail -n 180 dual_process_training.log; exit 1; }
          tail -n 80 dual_process_training.log
          mkdir -p published_dual
          cp "$RUNNER_TEMP/dual_v7/"*.json published_dual/
          cp "$RUNNER_TEMP/dual_v7/"*.csv published_dual/
          cp dual_process_training.log published_dual/
          cp official_sha256.txt published_dual/
      - name: Publish only aggregate physical and process concept influence receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physionet-separate-care-process-concepts-v7-${{ github.run_number }}
          path: |
            published_dual/
            dual_process_training.log
            official_sha256.txt
          retention-days: 21
          if-no-files-found: warn
