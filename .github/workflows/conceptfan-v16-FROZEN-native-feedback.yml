name: ConceptFAN V16 frozen native feedback ablation
on:
  push:
    branches: [experiment/conceptfan-v16-expert-feedback-native-20261104]
    paths:
      - '.github/workflows/conceptfan-v16-FROZEN-native-feedback.yml'
      - 'src/conceptfan_discovery/experiment_expert_feedback_v16.py'
      - 'src/conceptfan_discovery/expert_feedback_v16.py'
      - 'src/conceptfan_discovery/clinical_multiscale_v10.py'
      - 'tests/discovery/test_expert_feedback_v16.py'
  pull_request:
    branches: [experiment/conceptfan-v10-multiscale-20261103]
    paths:
      - '.github/workflows/conceptfan-v16-FROZEN-native-feedback.yml'
      - 'src/conceptfan_discovery/experiment_expert_feedback_v16.py'
      - 'src/conceptfan_discovery/expert_feedback_v16.py'
      - 'src/conceptfan_discovery/clinical_multiscale_v10.py'
      - 'tests/discovery/test_expert_feedback_v16.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v16-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src:.
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install fixed V10 research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Unit and V10 regression checks
        run: |
          python -m pytest tests/discovery/test_expert_feedback_v16.py tests/discovery/test_multiscale_physiology_v10.py -q
      - name: Twelve matched V10 native-model fits including exploration-only and wrong-expert controls
        run: |
          python -m conceptfan_discovery.experiment_expert_feedback_v16 --out-dir V16_FROZEN_SYNTHETIC
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('V16_FROZEN_SYNTHETIC/STATUS.json').read_text())
          assert r['status']=='V16_EXPLORATORY_SYNTHETIC_PROXY_EXPERT_ABLATION'
          assert r['twelve_fits_all_counted']
          assert len(r['per_seed_results'])==12
          assert len(r['aggregate'])==4
          assert r['test_ids_sealed']
          assert not r['human_doctor_annotations_provided']
          assert all(x['max_additive_logit_error'] < 2e-5 for x in r['per_seed_results'])
          PY
          git rev-parse HEAD > V16_FROZEN_SYNTHETIC/COMMIT_SHA.txt
      - name: Archive complete synthetic aggregate, including failed alternatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v16-native-feedback-full-denominator-${{ github.run_number }}
          path: V16_FROZEN_SYNTHETIC/
          if-no-files-found: warn
