name: ConceptFAN V18 matched native signed risk retraining
on:
  push:
    branches: [experiment/conceptfan-v18-independent-risk-screen-20261104]
    paths:
      - '.github/workflows/conceptfan-v18-frozen-native-training.yml'
      - 'src/conceptfan_discovery/experiment_native_risk_v18.py'
      - 'src/conceptfan_discovery/risk_screen_v18.py'
      - 'tests/discovery/test_risk_screen_v18.py'
  pull_request:
    branches: [experiment/conceptfan-v17-dynamic-concept-admission-20261104]
    paths:
      - '.github/workflows/conceptfan-v18-frozen-native-training.yml'
      - 'src/conceptfan_discovery/experiment_native_risk_v18.py'
      - 'src/conceptfan_discovery/risk_screen_v18.py'
      - 'tests/discovery/test_risk_screen_v18.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-model-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Install scientific CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify native risk and original V10 through V17 invariants
        run: |
          python -m pytest tests/discovery/test_risk_screen_v18.py tests/discovery/test_candidate_admission_v17.py tests/discovery/test_expert_feedback_v16.py tests/discovery/test_multiscale_physiology_v10.py -q
      - name: Train all accepted and abstained K2-K3 architecture variants
        run: |
          python -m conceptfan_discovery.experiment_native_risk_v18 --out-dir V18_NATIVE_RISK_TRAINING
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('V18_NATIVE_RISK_TRAINING/STATUS.json').read_text())
          assert x['status']=='V18_NATIVE_RISK_ORIENTATION_AND_GROUNDING_FULL_ABLATION'
          assert x['all_cases']==45
          assert len(x['summary'])==15
          assert x['risk_screen_disjoint_from_source_discovery']
          assert x['no_oracle_states_entered_training']
          assert x['raw_patient_contribution_vectors_not_exported']
          assert x['complete_denominator_includes_screen_abstentions']
          assert all(row['max_additive_error']<2e-5 for row in x['all_fits_and_abstentions'] if row['status']=='TRAINED')
          PY
          git rev-parse HEAD > V18_NATIVE_RISK_TRAINING/COMMIT_SHA.txt
      - name: Upload all real native fits and refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conceptfan-v18-all-native-fits-${{ github.run_number }}
          path: V18_NATIVE_RISK_TRAINING/
          if-no-files-found: warn
