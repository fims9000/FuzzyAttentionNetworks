name: Integrated ConceptFAN attested-source signed risk, expert edits and original K2 fallback
on:
  push:
    branches:
      - integration/conceptfan-semantic-contract-paper-20261106
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  integrated-concept-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ConceptFAN runtime and dependency requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify syntax, provenance and the real multi-component inference path
        run: |
          python -m compileall -q src/conceptfan_discovery/conceptfan_integrated_runtime_v52.py tests/discovery/test_conceptfan_integrated_runtime_v52.py
          python -m pytest -q tests/discovery/test_conceptfan_integrated_runtime_v52.py tests/discovery/test_observational_twins_anchor_v50.py tests/discovery/test_train_only_energy_debias_v51.py tests/discovery/test_verified_concept_intervention_v49.py tests/discovery/test_anchored_joint_bottleneck_v47.py
