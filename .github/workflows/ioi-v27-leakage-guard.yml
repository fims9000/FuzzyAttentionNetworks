name: IOI V27 fresh-draw joint vs staged concept leakage
on:
  push:
    branches:
      - experiment/ioi-v27-task-leakage-guard-20261106
    paths:
      - '.github/workflows/ioi-v27-leakage-guard.yml'
      - 'docs/medical/IOI_V27_FROZEN_CONCEPT_LEAKAGE_PROTOCOL_20261106.md'
      - 'scripts/experiment_concept_leakage_guard_v27.py'
      - 'tests/fan_attention/test_v27_concept_leakage_guard.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: src:.
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  concept-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical CPU native model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Test no outcome gradients in staged concept path
        run: |
          python -m compileall -q scripts/experiment_concept_leakage_guard_v27.py
          python -m pytest -q tests/fan_attention/test_v27_concept_leakage_guard.py \
            tests/fan_attention/test_v26_frozen_head_refit.py
      - name: Smoke native ConceptFAN training with new generator seed
        run: |
          python scripts/experiment_concept_leakage_guard_v27.py --smoke --out-dir V27_SMOKE | tee v27_smoke_log.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V27_SMOKE/STATUS.json').read_text())
          assert d['status']=='SMOKE_ONLY'
          assert d['n_training_runs']==4
          assert len(d['rows'])==45 and len(d['summary'])==45
          assert len(d['leakage_audit'])==6
          assert d['stage_pure_concept_path_independent_of_outcome_law']
          PY
      - name: Fresh full experiment with three independently initialized native fits
        run: |
          python scripts/experiment_concept_leakage_guard_v27.py --out-dir V27_NEW_DRAW_EVIDENCE | tee v27_full_log.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('V27_NEW_DRAW_EVIDENCE/STATUS.json').read_text())
          assert d['status']=='V27_NEW_DRAW_CONCEPT_TASK_LEAKAGE_EXPERIMENT'
          assert d['generator_seed']==20261107
          assert d['n_training_runs']==12
          assert len(d['rows'])==81 and len(d['summary'])==45
          assert len(d['leakage_audit'])==18
          assert d['sample_sizes']=={'train':1600,'unused_calibration':400,'test':800}
          assert all(x['additive_error']<2e-5 for x in d['rows'] if x.get('additive_error') is not None)
          assert d['artifact_observationally_same_as_omitted']
          PY
          git rev-parse HEAD > V27_NEW_DRAW_EVIDENCE/SOURCE_COMMIT_SHA.txt
      - name: Archive all negative and positive results by commit SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioi-v27-new-draw-concept-leakage-${{ github.run_number }}
          path: |
            V27_SMOKE/
            V27_NEW_DRAW_EVIDENCE/
            v27_smoke_log.jsonl
            v27_full_log.jsonl
          if-no-files-found: warn
